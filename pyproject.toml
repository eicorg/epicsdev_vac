[project]
name = "epicsdev-vac"
version = "0.0.2"
description = "PVAccess server for various vacuum gauge controllers"
readme = "README.md"
authors = [
    { name = "Sukhanov, Andrei", email = "sukhanov@bnl.gov" }
]
requires-python = ">=3.11"
dependencies = [
    "epicsdev>=3.3.3",
    "pyvisa>=1.14",
    "pyvisa-py>=0.7",
]

[project.scripts]
epicsdev-vac-brax = "epicsdev_vac_brax.__main__:main"

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
