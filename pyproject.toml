[project]
name = "epicsdev_vac"
version = "0.0.3"
description = "EPICS PVAccess server for various vacuum gauge controllers"
readme = "README.md"
authors = [
    { name = "Sukhanov, Andrey", email = "sukhanov@bnl.gov" }
]
requires-python = ">=3.11"
dependencies = [
    "epicsdev>=3.3.3",
    "pyvisa>=1.14",
    "pyvisa-py>=0.7",
]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[project.urls]
"Homepage" = "https://github.com/eicorg/epicsdev_vac"
"Bug Tracker" = "https://github.com/eicorg/epicsdev_vac"

